# Project identity for the SonarQube CLI and for any future CI-based scan
# (sonar list issues, sonar analyze, sonarqube-scan-action pick the project up
# from this file instead of needing -p on every call).
#
# Automatic Analysis IGNORES this file. The analysis scope (sources, tests,
# exclusions, python version) lives in .sonarcloud.properties, which is what
# Automatic Analysis reads, and it is read from the repository default branch:
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
# Keep the two in step if the analysis method ever changes.
# See thunderbird/addons-server#390.

sonar.projectKey=thunderbird_addons-server
sonar.organization=thunderbird
sonar.projectName=addons-server
sonar.sourceEncoding=UTF-8
sonar.python.version=3.6
