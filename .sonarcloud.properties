# SonarQube Cloud Automatic Analysis configuration.
#
# This is the file Automatic Analysis reads; a sonar-project.properties file is
# ignored by Automatic Analysis, and the docs say this file is read from "your
# repository's default branch":
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
# The repository default branch is currently master, so this file only takes
# effect for branch analysis once it reaches the default branch (or once
# stage-eks becomes the default branch). See thunderbird/addons-server#390.
#
# Only the keys Automatic Analysis supports are set here (sources, tests,
# inclusions/exclusions, sourceEncoding, cpd.exclusions, python.version).
# Automatic Analysis runs no tests, so there is no coverage report to point at.

sonar.sourceEncoding=UTF-8

# The deployed image is python:3.6 (Dockerfile.ecs). Raise this as the Python
# upgrade lands so the analyzer stops treating 3.6 syntax as the ceiling.
sonar.python.version=3.6

# Main (non-test) code. Anything not listed here is outside analysis on
# purpose: locale/ (gettext catalogs), docs/, media|logs|storage|site-static
# (runtime and build output), docker/ and node_modules/ (third party).
# The schematic SQL under src/olympia/migrations IS in scope; it is code we ship.
sonar.sources=src,services,scripts,infra,static,manage.py,settings.py,settings_local_stage.py,settings_local_k8s.py,setup.py

# Test code, kept out of the main set so test smells do not mask product issues.
sonar.tests=src,infra,tests,conftest.py,settings_test.py
sonar.test.inclusions=src/olympia/**/tests/**/*,infra/tests/**/*,tests/**/*,conftest.py,settings_test.py

# Excluded from the main set:
#   */tests/*                       indexed as tests above, must not be in both
#   */fixtures/*                    dumped add-on samples and JSON, not code
#   static/js/lib, static/js/node_lib, *.min.js, *.min.css
#                                   vendored or generated front-end assets
sonar.exclusions=src/olympia/**/tests/**/*,infra/tests/**/*,**/fixtures/**/*,static/js/lib/**/*,static/js/node_lib/**/*,**/*.min.js,**/*.min.css,**/node_modules/**/*

# Duplication detection: migrations are near-identical by nature.
sonar.cpd.exclusions=src/olympia/migrations/**/*
