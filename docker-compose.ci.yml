# CI-only overrides, selected by COMPOSE_FILE in .github/workflows/ci-tests.yml
# (thunderbird/addons-server#506). Image names stay as in docker-compose.yml so
# the workflow's pull step can try the GCR mirror, ECR Public and Docker Hub in
# turn for each image and retag; a registry pinned here would have no fallback.
# The autograph container must run: the signing tests talk to it over HTTP.
# Nothing is overridden today; the file exists so the CI compose set is explicit
# and can take CI-specific settings later. Local development is unaffected.
services: {}
